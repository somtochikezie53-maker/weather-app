<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="search">
      <input type="text" id="cityInput" placeholder="Enter city name..." spellcheck="false">
      <button id="searchBtn">Search</button>
    </div>
    
    <div class="error" id="errorMsg" style="display: none;">
      <p>City not found. Please try again!</p>
    </div>

    <div class="weather" id="weatherBox" style="display: none;">
      <h1 class="temp" id="temp">--°C</h1>
      <h2 class="city" id="cityName">City Name</h2>
      <p class="condition" id="condition">Condition</p>
      
      <div class="details">
        <div class="col">
          <div>
            <p class="humidity" id="humidity">--%</p>
            <p>Humidity</p>
          </div>
        </div>
        <div class="col">
          <div>
            <p class="wind" id="wind">-- km/h</p>
            <p>Wind Speed</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
